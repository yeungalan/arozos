<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!--
        user-scalable=no keeps a double-tap or a gloved pinch from zooming the
        UI mid-count; the layout is already sized for the handheld's screen.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Inventory</title>
    <link rel="icon" href="img/module_icon.svg">
    <link rel="stylesheet" href="../script/semantic/components/icon.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="../script/jquery.min.js"></script>
    <script src="../script/ao_module.js"></script>
    <!--
        Backend AGI scripts (server-side, user:/Document/Inventory/):
          Inventory/backend/init.agi           load items, locations, settings, recent movements
          Inventory/backend/stockOp.agi        stock in / out / count / move, journalled
          Inventory/backend/saveItem.agi       create or update an item
          Inventory/backend/deleteItem.agi     delete an item
          Inventory/backend/saveLocations.agi  replace the location pick list
          Inventory/backend/saveSettings.agi   persist thresholds and scanner options
          Inventory/backend/history.agi        paged movement journal
          Inventory/backend/exportCsv.agi      CSV export: items, batches, journal, runs

        Batches, blind counts, cables and the local barcode catalogue:
          Inventory/backend/countStart.agi     open or resume a blind cycle count
          Inventory/backend/countTally.agi     one scan is one unit
          Inventory/backend/countReview.agi    the variance report
          Inventory/backend/countCommit.agi    post the counted numbers to stock
          Inventory/backend/countCancel.agi    abandon the count
          Inventory/backend/saveRun.agi        create or update an installed cable run
          Inventory/backend/deleteRun.agi      remove a cable run
          Inventory/backend/catalogueLookup.agi  local barcode to name, no network
          Inventory/backend/catalogueImport.agi  import a UPC / JAN list

        Remote scanner pairing (scan on a handheld, act on a desktop):
          Inventory/backend/pairHost.agi       host: create or refresh a session
          Inventory/backend/pairPoll.agi       host: long-poll for forwarded scans
          Inventory/backend/pairJoin.agi       handheld: join with the pairing code
          Inventory/backend/pairPush.agi       handheld: forward one barcode
          Inventory/backend/pairEnd.agi        either end: leave or end the session
    -->
</head>

<body>
    <div id="app">

        <div class="topbar">
            <div class="title">Inventory<span class="subtitle" id="topSubtitle">Loading...</span></div>
            <button class="icon-btn" id="btnAdd" title="New item"><i class="plus icon"></i></button>
            <button class="icon-btn" id="btnFullscreen" title="Full screen">
                <i class="expand icon" id="fullscreenIcon"></i>
            </button>
            <button class="icon-btn" id="btnTheme" title="Toggle theme"><i class="moon icon" id="themeIcon"></i></button>
        </div>

        <div class="views" id="views">

            <!-- ── Scan ──────────────────────────────────────────────────── -->
            <div class="view active" id="view-scan">
                <!--
                    Two .scan-pane columns: the handheld stacks them, the
                    desktop layout puts the controls left and the result right.
                -->
                <div class="scan-pane">
                    <!-- Remote-scanner status, filled in by app.js when paired -->
                    <div id="pairBar"></div>

                    <!-- Mode buttons are rendered by app.js so the list stays in one place -->
                    <div class="mode-grid" id="modeGrid"></div>

                    <div class="card" id="contextCard"></div>

                    <div class="scan-box listening" id="scanBox">
                        <div class="scan-status">
                            <span class="scan-dot"></span>
                            <span id="scanStatusText">Ready</span>
                        </div>
                        <div class="scan-row">
                            <!--
                                data-scan marks a field a barcode can land in. app.js
                                arms every one of them without a tap and with the
                                on-screen keyboard suppressed, so a trigger pull always
                                has somewhere to go and the keyboard never covers the
                                screen. Tapping an already-armed field lifts the
                                suppression so it can be typed by hand. On a desktop,
                                where there is no soft keyboard, none of this applies
                                and the fields behave completely normally.
                            -->
                            <input id="scanInput" type="text" data-scan="1" inputmode="none"
                                placeholder="Scan barcode"
                                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                            <button class="btn square primary" id="scanSubmit" title="Submit code">
                                <i class="arrow right icon"></i>
                            </button>
                            <button class="btn square" id="kbToggle" title="On-screen keyboard">
                                <i class="keyboard icon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Shown only in the desktop layout -->
                    <div class="shortcut-bar desktop-only">
                        <span><kbd>F1</kbd>-<kbd>F5</kbd> mode</span>
                        <span><kbd>Ctrl</kbd>+<kbd>F</kbd> find</span>
                        <span><kbd>Ctrl</kbd>+<kbd>N</kbd> new item</span>
                        <span><kbd>Esc</kbd> close</span>
                    </div>
                </div>

                <div class="scan-pane">
                    <div id="scanResult"></div>
                    <div id="sessionLog"></div>
                </div>
            </div>

            <!-- ── Find ──────────────────────────────────────────────────── -->
            <div class="view" id="view-search">
                <div class="search-wrap">
                    <i class="search icon"></i>
                    <input id="searchInput" type="text" data-scan="1"
                        placeholder="Name, barcode, SKU, location..."
                        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <button class="search-clear" id="searchClear" title="Clear">
                        <i class="times circle icon"></i>
                    </button>
                </div>
                <div class="chip-row" id="filterChips"></div>
                <div class="section-title" id="searchMeta"></div>
                <div class="card flush" id="searchResults"></div>
            </div>

            <!-- ── Alerts ────────────────────────────────────────────────── -->
            <div class="view" id="view-alerts">
                <div id="alertsBody"></div>
            </div>

            <!-- ── Cables: installed runs between endpoints ───────────────── -->
            <div class="view" id="view-cables">
                <div id="cablesBody"></div>
            </div>

            <!-- ── More ──────────────────────────────────────────────────── -->
            <div class="view" id="view-more">
                <div id="moreBody"></div>
            </div>

        </div>

        <div class="navbar">
            <button class="nav-btn active" data-view="scan">
                <i class="barcode icon"></i><span>Scan</span>
            </button>
            <button class="nav-btn" data-view="search">
                <i class="search icon"></i><span>Find</span>
            </button>
            <button class="nav-btn" data-view="alerts">
                <i class="bell icon"></i><span>Alerts</span>
                <span class="nav-badge hidden" id="alertBadge">0</span>
            </button>
            <button class="nav-btn" data-view="cables">
                <i class="plug icon"></i><span>Cables</span>
            </button>
            <button class="nav-btn" data-view="more">
                <i class="ellipsis horizontal icon"></i><span>More</span>
            </button>
        </div>

        <div class="sheet-backdrop" id="sheetBackdrop"></div>
        <div class="sheet" id="sheet">
            <div class="sheet-head">
                <button class="icon-btn" id="sheetClose" title="Close"><i class="close icon"></i></button>
                <div class="title" id="sheetTitle"></div>
            </div>
            <div class="sheet-body" id="sheetBody"></div>
            <div class="sheet-foot" id="sheetFoot"></div>
        </div>

        <div id="toast"></div>
    </div>

    <script src="script/search.js"></script>
    <script src="script/cablediagram.js"></script>
    <script src="script/scanner.js"></script>
    <script src="script/pairing.js"></script>
    <script src="script/app.js"></script>
</body>

</html>
