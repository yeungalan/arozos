<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Viewer</title>

  <!-- jQuery (required by ao_module.js) -->
  <script src="./include/jquery/jquery-1.12.4.min.js"></script>
  <script src="../script/ao_module.js"></script>

  <style>
    :root {
      --toolbar-bg:   #1c2128;
      --toolbar-text: #cdd9e5;
      --bg:           #f0f2f5;
      --surface:      #ffffff;
      --border:       #d0d7de;
      --text:         #24292f;
      --text-muted:   #57606a;
      --accent:       #0969da;
      --radius:       6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #0d1117;
        --surface:   #161b22;
        --border:    #30363d;
        --text:      #c9d1d9;
        --text-muted:#8b949e;
        --accent:    #58a6ff;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Toolbar ── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 46px;
      background: var(--toolbar-bg);
      color: var(--toolbar-text);
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0,0,0,.35);
      user-select: none;
    }

    #file-icon  { font-size: 17px; flex-shrink: 0; line-height: 1; }
    #file-name  {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-doc  { background:#1f6feb; color:#fff; }
    .badge-xls  { background:#2ea043; color:#fff; }
    .badge-ppt  { background:#da3633; color:#fff; }
    .badge-pdf  { background:#e16328; color:#fff; }
    .badge-img  { background:#6e7681; color:#fff; }
    .badge-misc { background:#484f58; color:#fff; }

    #toolbar-actions { display:flex; gap:6px; }

    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: var(--radius);
      color: var(--toolbar-text);
      padding: 4px 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background .12s;
    }
    .tbtn:hover { background: rgba(255,255,255,.18); }

    /* ── Viewer area ── */
    #wrap {
      position: absolute;
      inset: 46px 0 0 0;
      display: flex;
      flex-direction: column;
    }

    /* ── States ── */
    .state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      padding: 40px;
      text-align: center;
    }
    .state.visible { display: flex; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-label { color: var(--text-muted); font-size: 13px; }

    .state-icon   { font-size: 44px; }
    .state-title  { font-size: 17px; font-weight: 600; }
    .state-detail { font-size: 13px; color: var(--text-muted); max-width: 420px; }

    /* ── PDF viewer (primary rendering surface) ── */
    #pdf-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
    }
    #pdf-frame.visible { display: block; }

    /* ── Image viewer ── */
    #img-view {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 20px;
      overflow: auto;
    }
    #img-view.visible { display: flex; }
    #img-view img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <span id="file-icon"></span>
    <span id="file-name">Loading…</span>
    <span id="file-badge" class="badge badge-misc"></span>
    <div id="toolbar-actions">
      <a id="dl-btn" class="tbtn" href="#">↓&nbsp;Download</a>
    </div>
  </div>

  <div id="wrap">
    <!-- Loading -->
    <div id="state-loading" class="state visible">
      <div class="spinner"></div>
      <div id="loading-label">Preparing document…</div>
    </div>

    <!-- Error -->
    <div id="state-error" class="state">
      <div class="state-icon">⚠️</div>
      <div class="state-title">Could not open this file</div>
      <div id="error-detail" class="state-detail"></div>
    </div>

    <!-- Unsupported -->
    <div id="state-unsupported" class="state">
      <div class="state-icon">📄</div>
      <div id="uns-title" class="state-title">Preview not available</div>
      <div id="uns-hint"  class="state-detail"></div>
    </div>

    <!-- PDF (used for all converted documents) -->
    <embed id="pdf-frame" type="application/pdf" src="">

    <!-- Image -->
    <div id="img-view">
      <img id="img-el" src="" alt="">
    </div>
  </div>

<script>
'use strict';

// ── Metadata ─────────────────────────────────────────────────────────
const ICONS = {
  doc:'📝', docx:'📝', odt:'📝', fodt:'📝', rtf:'📝',
  xls:'📊', xlsx:'📊', ods:'📊', fods:'📊', csv:'📋',
  ppt:'🎞️', pptx:'🎞️', odp:'🎞️', fodp:'🎞️',
  pdf:'📕',
  jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️',
  svg:'🖼️', bmp:'🖼️', webp:'🖼️', tiff:'🖼️', tif:'🖼️',
};

const BADGES = {
  doc:'badge-doc', docx:'badge-doc', odt:'badge-doc', fodt:'badge-doc', rtf:'badge-doc',
  xls:'badge-xls', xlsx:'badge-xls', ods:'badge-xls', fods:'badge-xls', csv:'badge-xls',
  ppt:'badge-ppt', pptx:'badge-ppt', odp:'badge-ppt', fodp:'badge-ppt',
  pdf:'badge-pdf',
  jpg:'badge-img', jpeg:'badge-img', png:'badge-img', gif:'badge-img',
  svg:'badge-img', bmp:'badge-img', webp:'badge-img', tiff:'badge-img', tif:'badge-img',
};

const IMAGE_EXTS = new Set([
  'jpg','jpeg','png','gif','bmp','svg','webp','tiff','tif'
]);

// ── Panels ────────────────────────────────────────────────────────────
function show(id) {
  ['state-loading','state-error','state-unsupported','pdf-frame','img-view']
    .forEach(p => {
      const el = document.getElementById(p);
      if (el) el.classList.toggle('visible', p === id);
    });
}

function showError(msg) {
  document.getElementById('error-detail').textContent = msg;
  show('state-error');
}

// ── Bootstrap ─────────────────────────────────────────────────────────
const inputFiles = ao_module_loadInputFiles();
if (!inputFiles || !inputFiles.length) {
  window.location.href = './index.html';
}

const lf       = inputFiles[0];
const filePath = lf.filepath;
const fileName = lf.filename;
const ext      = filePath.split('.').pop().toLowerCase();
const dlURL    = '/media?download=true&file=' + encodeURIComponent(filePath);

// Populate toolbar
document.getElementById('file-icon').textContent = ICONS[ext] || '📄';
document.getElementById('file-name').textContent  = fileName;
const badge = document.getElementById('file-badge');
badge.textContent = ext.toUpperCase();
badge.className   = 'badge ' + (BADGES[ext] || 'badge-misc');
document.getElementById('dl-btn').href = dlURL;
ao_module_setWindowTitle('OfficeViewer — ' + fileName);

// ── Render ────────────────────────────────────────────────────────────
if (IMAGE_EXTS.has(ext)) {
  // Images: render natively
  const img = document.getElementById('img-el');
  img.onload  = () => show('img-view');
  img.onerror = () => showError('Could not load the image file.');
  img.alt     = fileName;
  img.src     = '/media?file=' + encodeURIComponent(filePath);

} else if (ext === 'pdf') {
  // PDF: serve directly via native browser renderer
  renderPDF('/media?file=' + encodeURIComponent(filePath));

} else if (ext === 'txt' || ext === 'md') {
  // Plain text: fetch and show in a pre
  fetch('/media?file=' + encodeURIComponent(filePath))
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.text(); })
    .then(text => {
      const pre = document.createElement('pre');
      pre.style.cssText = 'padding:24px;font-size:13px;white-space:pre-wrap;word-break:break-word;height:100%;overflow:auto;background:var(--surface);color:var(--text)';
      pre.textContent = text;
      document.getElementById('wrap').appendChild(pre);
      show('');
    })
    .catch(e => showError(e.message));

} else {
  // All other formats: let Go convert to PDF via LibreOffice
  const convertURL = '/OfficeViewer/api/convert?file=' + encodeURIComponent(filePath);
  document.getElementById('loading-label').textContent = 'Converting with LibreOffice…';

  // Probe the endpoint first to surface a clean error message
  fetch(convertURL, { method: 'HEAD' })
    .then(r => {
      if (!r.ok) return r.text().then(t => { throw new Error(t || r.statusText); });
      renderPDF(convertURL);
    })
    .catch(e => showError(e.message));
}

function renderPDF(src) {
  const embed = document.getElementById('pdf-frame');
  embed.onload = () => show('pdf-frame');
  // Fallback: some browsers fire no events for embed; show after a short delay
  setTimeout(() => {
    if (!embed.classList.contains('visible')) show('pdf-frame');
  }, 800);
  embed.src = src;
}
</script>
</body>
</html>
