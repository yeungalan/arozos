<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Viewer</title>

  <!-- jQuery (required by ao_module.js and PPTXjs) -->
  <script src="./include/jquery/jquery-1.12.4.min.js"></script>
  <script src="../script/ao_module.js"></script>

  <!-- DOCX: mammoth.js -->
  <script src="./include/docx/jszip-utils.js"></script>
  <script src="./include/docx/mammoth.browser.min.js"></script>

  <!-- PPTX: PPTXjs -->
  <link rel="stylesheet" href="./include/PPTXjs/css/pptxjs.css">
  <link rel="stylesheet" href="./include/PPTXjs/css/nv.d3.min.css">
  <script src="./include/PPTXjs/js/filereader.js"></script>
  <script src="./include/PPTXjs/js/d3.min.js"></script>
  <script src="./include/PPTXjs/js/nv.d3.min.js"></script>
  <script src="./include/PPTXjs/js/pptxjs.js"></script>
  <script src="./include/PPTXjs/js/divs2slides.js"></script>

  <!-- Spreadsheets: SheetJS -->
  <script src="./include/SheetJS/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg:           #f0f2f5;
      --surface:      #ffffff;
      --surface-2:    #f6f8fa;
      --border:       #d0d7de;
      --text:         #24292f;
      --text-muted:   #57606a;
      --accent:       #0969da;
      --toolbar-bg:   #1c2128;
      --toolbar-text: #cdd9e5;
      --shadow-sm:    0 1px 3px rgba(0,0,0,.10);
      --radius:       6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:          #0d1117;
        --surface:     #161b22;
        --surface-2:   #21262d;
        --border:      #30363d;
        --text:        #c9d1d9;
        --text-muted:  #8b949e;
        --accent:      #58a6ff;
        --toolbar-bg:  #161b22;
        --toolbar-text:#cdd9e5;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Toolbar ───────────────────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 46px;
      background: var(--toolbar-bg);
      color: var(--toolbar-text);
      flex-shrink: 0;
      border-bottom: 1px solid rgba(0,0,0,.3);
      user-select: none;
    }

    #file-icon { font-size: 17px; flex-shrink: 0; line-height: 1; }

    #file-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--toolbar-text);
    }

    .type-badge {
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-docx { background: #1f6feb; color: #fff; }
    .badge-pptx { background: #da3633; color: #fff; }
    .badge-xlsx { background: #2ea043; color: #fff; }
    .badge-csv  { background: #8957e5; color: #fff; }
    .badge-pdf  { background: #e16328; color: #fff; }
    .badge-img  { background: #6e7681; color: #fff; }
    .badge-default { background: #484f58; color: #fff; }

    #toolbar-actions { display: flex; gap: 6px; }

    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      color: var(--toolbar-text);
      padding: 4px 10px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: background .12s;
      white-space: nowrap;
    }
    .tbtn:hover { background: rgba(255,255,255,.16); }

    /* ── Viewer area ───────────────────────────────────────────────── */
    #viewer-wrap {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    /* ── Loading ───────────────────────────────────────────────────── */
    #state-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-label { color: var(--text-muted); font-size: 13px; }

    /* ── Error ─────────────────────────────────────────────────────── */
    #state-error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      padding: 40px;
      text-align: center;
    }
    #state-error .err-icon { font-size: 44px; }
    #state-error .err-title { font-size: 17px; font-weight: 600; }
    #state-error .err-detail { font-size: 13px; color: var(--text-muted); max-width: 380px; }

    /* ── Unsupported ───────────────────────────────────────────────── */
    #state-unsupported {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      text-align: center;
      padding: 40px;
    }
    #state-unsupported .uns-icon { font-size: 44px; }
    #state-unsupported .uns-title { font-size: 17px; font-weight: 600; }
    #state-unsupported .uns-hint { font-size: 13px; color: var(--text-muted); }

    /* ── DOCX ──────────────────────────────────────────────────────── */
    #view-docx {
      display: none;
      max-width: 820px;
      margin: 28px auto;
      background: var(--surface);
      padding: 56px 72px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      min-height: calc(100% - 56px);
      line-height: 1.7;
      font-size: 15px;
    }
    #view-docx img { max-width: 100%; height: auto; }
    #view-docx table { border-collapse: collapse; width: 100%; margin: .8em 0; }
    #view-docx td, #view-docx th {
      border: 1px solid var(--border);
      padding: 5px 9px;
      vertical-align: top;
    }
    #view-docx th { background: var(--surface-2); font-weight: 600; }
    #view-docx h1,#view-docx h2,#view-docx h3,#view-docx h4 { margin: .9em 0 .4em; }
    #view-docx p { margin: .4em 0; }
    @media (max-width: 640px) {
      #view-docx { margin: 8px; padding: 24px 18px; }
    }

    /* ── PPTX ──────────────────────────────────────────────────────── */
    #view-pptx {
      display: none;
      width: 100%;
      height: 100%;
    }
    #view-pptx .slides-toolbar { width: 100% !important; }
    #view-pptx .slide {
      margin-left: auto !important;
      margin-right: auto !important;
      max-width: calc(100% - 12px) !important;
    }

    /* ── Spreadsheet ───────────────────────────────────────────────── */
    #view-sheet {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    #sheet-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 7px 10px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-tab {
      padding: 3px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      transition: all .12s;
      font-family: inherit;
    }
    .sheet-tab:hover { color: var(--text); }
    .sheet-tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #sheet-scroll { flex: 1; overflow: auto; }

    .sheet-pane { display: none; }
    .sheet-pane.visible { display: block; }

    .sheet-table {
      border-collapse: collapse;
      font-size: 13px;
      min-width: 100%;
    }
    .sheet-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .3px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
      user-select: none;
    }
    .sheet-table thead th.row-num {
      min-width: 36px;
      color: var(--text-muted);
    }
    .sheet-table tbody td {
      padding: 4px 11px;
      border: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sheet-table tbody td.row-num {
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      background: var(--surface-2);
      user-select: none;
    }
    .sheet-table tbody tr:hover td { background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
    .sheet-table tbody tr:hover td.row-num { background: var(--surface-2); }

    /* ── PDF ───────────────────────────────────────────────────────── */
    #view-pdf {
      display: none;
      width: 100%;
      height: 100%;
    }
    #view-pdf embed {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Image ─────────────────────────────────────────────────────── */
    #view-img {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 20px;
    }
    #view-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <span id="file-icon"></span>
    <span id="file-name">Loading…</span>
    <span id="type-badge" class="type-badge badge-default"></span>
    <div id="toolbar-actions">
      <a id="dl-btn" class="tbtn" href="#" title="Download file">
        ↓&nbsp;Download
      </a>
    </div>
  </div>

  <!-- ── Content area ── -->
  <div id="viewer-wrap">

    <!-- loading -->
    <div id="state-loading">
      <div class="spinner"></div>
      <div id="loading-label">Loading document…</div>
    </div>

    <!-- error -->
    <div id="state-error">
      <div class="err-icon">⚠️</div>
      <div class="err-title">Could not load this file</div>
      <div class="err-detail" id="err-detail"></div>
    </div>

    <!-- unsupported format -->
    <div id="state-unsupported">
      <div class="uns-icon">📄</div>
      <div class="uns-title" id="uns-title">Format not supported</div>
      <div class="uns-hint" id="uns-hint"></div>
    </div>

    <!-- DOCX -->
    <div id="view-docx"></div>

    <!-- PPTX -->
    <div id="view-pptx"></div>

    <!-- Spreadsheet -->
    <div id="view-sheet">
      <div id="sheet-tabs"></div>
      <div id="sheet-scroll"></div>
    </div>

    <!-- PDF -->
    <div id="view-pdf">
      <embed id="pdf-embed" src="" type="application/pdf">
    </div>

    <!-- Image -->
    <div id="view-img">
      <img id="img-el" src="" alt="">
    </div>

  </div>

<script>
'use strict';

// ── Helpers ──────────────────────────────────────────────────────────
const FILE_ICONS = {
  docx:'📝', doc:'📝',
  pptx:'📊', ppt:'📊',
  xlsx:'📈', xls:'📈', csv:'📋', ods:'📈', fods:'📈', xlsm:'📈', xlsb:'📈',
  pdf:'📕',
  jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', svg:'🖼️', bmp:'🖼️', webp:'🖼️', tiff:'🖼️', tif:'🖼️',
};

const FILE_BADGE_CLASS = {
  docx:'badge-docx', doc:'badge-docx',
  pptx:'badge-pptx', ppt:'badge-pptx',
  xlsx:'badge-xlsx', xls:'badge-xlsx', ods:'badge-xlsx', fods:'badge-xlsx', xlsm:'badge-xlsx', xlsb:'badge-xlsx',
  csv:'badge-csv',
  pdf:'badge-pdf',
  jpg:'badge-img', jpeg:'badge-img', png:'badge-img', gif:'badge-img',
  svg:'badge-img', bmp:'badge-img', webp:'badge-img', tiff:'badge-img', tif:'badge-img',
};

const SPREADSHEET_EXTS = new Set([
  'xlsx','xls','xlw','xlsb','xlsm','csv','dbf','dif','slk','sylk','prn','ods','fods'
]);
const IMAGE_EXTS = new Set([
  'jpg','jpeg','png','gif','bmp','svg','webp','tiff','tif'
]);

function showPanel(id) {
  const panels = [
    'state-loading','state-error','state-unsupported',
    'view-docx','view-pptx','view-sheet','view-pdf','view-img'
  ];
  panels.forEach(p => {
    const el = document.getElementById(p);
    if (!el) return;
    if (p === id) {
      // flex containers
      if (['state-error','state-unsupported','view-sheet','view-img','state-loading'].includes(p)) {
        el.style.display = 'flex';
      } else {
        el.style.display = '';
      }
    } else {
      el.style.display = 'none';
    }
  });
}

function showError(msg) {
  document.getElementById('err-detail').textContent = msg || 'An unexpected error occurred.';
  showPanel('state-error');
}

function colLetter(n) {
  let s = '';
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Bootstrap ────────────────────────────────────────────────────────
const inputFiles = ao_module_loadInputFiles();
if (!inputFiles || inputFiles.length === 0) {
  window.location.href = './index.html';
}

const lf       = inputFiles[0];
const filePath = lf.filepath;
const fileName = lf.filename;
const ext      = filePath.split('.').pop().toLowerCase();
const fileURL  = '/media?file=' + encodeURIComponent(filePath);
const dlURL    = '/media?download=true&file=' + encodeURIComponent(filePath);

// Populate toolbar
document.getElementById('file-icon').textContent = FILE_ICONS[ext] || '📄';
document.getElementById('file-name').textContent  = fileName;
const badge = document.getElementById('type-badge');
badge.textContent  = ext.toUpperCase();
badge.className    = 'type-badge ' + (FILE_BADGE_CLASS[ext] || 'badge-default');
document.getElementById('dl-btn').href = dlURL;
ao_module_setWindowTitle('OfficeViewer — ' + fileName);

// ── Renderers ────────────────────────────────────────────────────────

function renderDocx(url) {
  JSZipUtils.getBinaryContent(url, function(err, content) {
    if (err) { showError('Failed to fetch file: ' + err.message); return; }
    mammoth.convertToHtml({ arrayBuffer: content })
      .then(function(result) {
        const el = document.getElementById('view-docx');
        el.innerHTML = result.value || '<p style="color:var(--text-muted)">This document appears to be empty.</p>';
        if (/[֐-׿؀-ۿ]/.test(result.value)) el.setAttribute('dir','rtl');
        showPanel('view-docx');
      })
      .catch(function(e) { showError('Failed to render document: ' + e.message); });
  });
}

function renderPptx(url) {
  showPanel('view-pptx');
  $('#view-pptx').pptxToHtml({
    pptxFileUrl: url,
    slideMode: true,
    slideModeConfig: {
      nav:              true,
      keyBoardShortCut: true,
      showSlideNum:     true,
      showTotalSlideNum:true,
      autoSlide:        false,
      loop:             false,
      transition:       'default',
      transitionTime:   0.5
    }
  });
}

function renderSheet(url) {
  const req = new XMLHttpRequest();
  req.open('GET', url, true);
  req.responseType = 'arraybuffer';
  req.onload = function() {
    try {
      const wb = XLSX.read(new Uint8Array(req.response), { type: 'array' });
      const tabsEl   = document.getElementById('sheet-tabs');
      const scrollEl = document.getElementById('sheet-scroll');

      wb.SheetNames.forEach(function(name, idx) {
        // Tab
        const tab = document.createElement('button');
        tab.className   = 'sheet-tab' + (idx === 0 ? ' active' : '');
        tab.textContent = name;
        tab.dataset.idx = idx;
        tabsEl.appendChild(tab);

        // Pane
        const json = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'' });
        const pane = document.createElement('div');
        pane.className = 'sheet-pane' + (idx === 0 ? ' visible' : '');
        pane.id = 'sp-' + idx;

        if (!json || json.length === 0) {
          pane.innerHTML = '<p style="padding:20px;color:var(--text-muted)">This sheet is empty.</p>';
        } else {
          const maxCols = json.reduce((m, r) => Math.max(m, r.length), 0);
          let lastRow = json.length;
          while (lastRow > 0 && json[lastRow - 1].every(c => c === '' || c == null)) lastRow--;

          let h = '<table class="sheet-table"><thead><tr><th class="row-num"></th>';
          for (let c = 0; c < maxCols; c++) h += '<th>' + colLetter(c) + '</th>';
          h += '</tr></thead><tbody>';
          for (let r = 0; r < lastRow; r++) {
            h += '<tr><td class="row-num">' + (r + 1) + '</td>';
            for (let c = 0; c < maxCols; c++) {
              const v = json[r][c];
              h += '<td title="' + escHtml(v == null ? '' : String(v)) + '">'
                + escHtml(v == null ? '' : String(v)) + '</td>';
            }
            h += '</tr>';
          }
          h += '</tbody></table>';
          pane.innerHTML = h;
        }
        scrollEl.appendChild(pane);
      });

      // Tab switching
      tabsEl.addEventListener('click', function(e) {
        const t = e.target.closest('.sheet-tab');
        if (!t) return;
        tabsEl.querySelectorAll('.sheet-tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        scrollEl.querySelectorAll('.sheet-pane').forEach(x => x.classList.remove('visible'));
        document.getElementById('sp-' + t.dataset.idx).classList.add('visible');
      });

      showPanel('view-sheet');
    } catch(e) {
      showError('Failed to parse spreadsheet: ' + e.message);
    }
  };
  req.onerror = function() { showError('Network error while loading the file.'); };
  req.send();
}

function renderPdf(url) {
  document.getElementById('pdf-embed').src = url;
  showPanel('view-pdf');
}

function renderImage(url) {
  const img = document.getElementById('img-el');
  img.src = url;
  img.alt = fileName;
  showPanel('view-img');
}

function renderUnsupported(hint) {
  document.getElementById('uns-title').textContent = '.' + ext.toUpperCase() + ' files cannot be previewed';
  document.getElementById('uns-hint').textContent  = hint || 'Download the file to open it in a local application.';
  showPanel('state-unsupported');
}

// ── Dispatch ─────────────────────────────────────────────────────────
if (ext === 'docx') {
  renderDocx(fileURL);
} else if (ext === 'doc') {
  renderUnsupported('Convert to .docx for in-browser preview.');
} else if (ext === 'pptx') {
  renderPptx(fileURL);
} else if (ext === 'ppt') {
  renderUnsupported('Convert to .pptx for in-browser preview.');
} else if (ext === 'pdf') {
  renderPdf(fileURL);
} else if (SPREADSHEET_EXTS.has(ext)) {
  renderSheet(fileURL);
} else if (IMAGE_EXTS.has(ext)) {
  renderImage(fileURL);
} else {
  renderUnsupported();
}
</script>
</body>
</html>
