<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Viewer</title>

  <!-- ao_module.js requires jQuery -->
  <script src="./include/jquery/jquery-3.3.1.min.js"></script>
  <script src="../script/ao_module.js"></script>

  <!-- DOCX rendering: mammoth converts DOCX to semantic HTML with correct image MIME types -->
  <script src="./include/docxjs/mammoth.browser.min.js"></script>

  <!-- Modern viewer styles -->
  <link rel="stylesheet" href="./include/officeViewer/viewer.css">
</head>
<body>
  <div id="ov-root">
    <!-- Toolbar -->
    <div id="ov-toolbar">
      <div id="ov-file-icon" class="ov-toolbar-icon">?</div>
      <div id="ov-filename">Loading…</div>
      <div class="ov-toolbar-sep"></div>
      <button class="ov-toolbar-btn primary" id="ov-btn-download">
        &#8659; Download
      </button>
    </div>

    <!-- Content area — filled by viewer.js -->
    <div id="ov-content">
      <div id="ov-loading">
        <div class="ov-spinner"></div>
        <div>Loading document…</div>
      </div>
    </div>
  </div>

  <script src="./include/officeViewer/viewer.js"></script>
</body>
</html>
