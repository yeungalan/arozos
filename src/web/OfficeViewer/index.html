<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2128">
  <link rel="icon" type="image/png" href="img/module_icon.png">
  <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
  <title>Office Viewer</title>
  <script src="../script/ao_module.js"></script>
  <style>
    :root {
      --bg:#f0f2f5; --surface:#fff; --border:#d0d7de;
      --text:#24292f; --muted:#57606a; --accent:#0969da; --acc-h:#0550ae;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --surface:#161b22; --border:#30363d;
              --text:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --acc-h:#79c0ff; }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); height: 100vh;
           display: flex; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 40px 36px 32px; text-align: center;
            max-width: 320px; width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    .logo { font-size: 52px; margin-bottom: 14px; line-height: 1; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.55; }
    .open-btn { display: flex; align-items: center; justify-content: center; gap: 7px;
                width: 100%; background: var(--accent); color: #fff; border: none;
                border-radius: 8px; padding: 11px 20px; font-size: 15px; font-weight: 500;
                font-family: inherit; cursor: pointer; transition: background .13s; }
    .open-btn:hover { background: var(--acc-h); }
    .fmts { display: flex; flex-wrap: wrap; gap: 5px;
            justify-content: center; margin-top: 20px; }
    .fmt { background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
           padding: 2px 7px; font-size: 10px; font-weight: 600; color: var(--muted);
           font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           letter-spacing: .3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📂</div>
    <h1>Office Viewer</h1>
    <p class="sub">Preview documents, spreadsheets, presentations, and more — right in your browser.</p>
    <button class="open-btn" onclick="openFileSelector()">Open File</button>
    <div class="fmts">
      <span class="fmt">DOCX</span><span class="fmt">PPTX</span>
      <span class="fmt">XLSX</span><span class="fmt">CSV</span>
      <span class="fmt">PDF</span><span class="fmt">ODS</span>
      <span class="fmt">PNG/JPG/SVG</span>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', openFileSelector);

    function openFileSelector() {
      ao_module_openFileSelector(fileSelected, 'user:/Document', 'file', false, {
        filter: ['docx','pptx','xlsx','csv','pdf','ods','xls','xlsm',
                 'jpg','jpeg','png','gif','svg','webp','bmp','txt','md']
      });
    }

    function fileSelected(filedata) {
      if (!filedata || !filedata.length) return;
      ao_module_setWindowSize(1060, 680);
      const hash = encodeURIComponent(JSON.stringify(filedata));
      let base = window.location.href;
      if (base.includes('index.html')) base = base.slice(0, base.lastIndexOf('/') + 1);
      else if (!base.endsWith('/')) base += '/';
      window.location.href = base + 'embedded.html#' + hash;
    }
  </script>
</body>
</html>
