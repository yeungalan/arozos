<!DOCTYPE html>
<html>
<head>
    <title>System Logs</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
    <link rel="stylesheet" href="../../script/semantic/semantic.min.css">
    <script type="text/javascript" src="../../script/jquery.min.js"></script>
    <script type="text/javascript" src="../../script/semantic/semantic.min.js"></script>
    <style>
        .clickable {
            cursor: pointer;
        }
        .clickable:hover {
            opacity: 0.7;
        }
        .logfile {
            padding-left: 1em !important;
            position: relative;
            padding-right: 1em !important;
        }
        .logfile .showing {
            position: absolute;
            top: 0.18em;
            right: 0em;
            margin-right: -0.4em;
            opacity: 0;
        }
        .logfile.active .showing {
            opacity: 1;
        }
        #logrender {
            width: 100% !important;
            height: calc(100vh - 280px);
            min-height: 300px;
            border: 1px solid rgb(231, 231, 231);
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 1em;
            resize: none;
        }
        #logListPanel {
            background-color: #f9f9f9;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
            padding: 1em;
            height: calc(100vh - 280px);
            min-height: 300px;
            overflow-y: auto;
        }
        .log-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5em;
        }
    </style>
</head>

<body>
    <div class="ui container">
        <p>Developer Options</p>
        <h1 class="ui header">
            Log View
            <div class="sub header">Check system logs in real time</div>
        </h1>
        <div class="ui divider"></div>

        <div class="ui stackable grid">
            <div class="four wide column">
                <div id="logListPanel">
                    <h4 class="ui header" style="margin-bottom: 0.5em;">
                        <i class="folder outline icon"></i>
                        <div class="content">Log Files</div>
                    </h4>
                    <div class="ui divider" style="margin: 0.5em 0;"></div>
                    <div id="logList" class="ui accordion"></div>
                    <div class="ui divider" style="margin: 0.5em 0;"></div>
                    <div class="ui tiny message" style="margin: 0;">
                        <i class="info circle icon"></i>
                        Some log files may be large. Check the file size before opening.
                    </div>
                </div>
            </div>
            <div class="twelve wide column">
                <div class="log-toolbar">
                    <span id="currentLogLabel" style="color: #888; font-size: 0.9em;">
                        <i class="file outline icon"></i> No file selected
                    </span>
                    <button class="ui mini basic blue button" onclick="openLogInNewTab();">
                        <i class="external alternate icon"></i> Open In New Tab
                    </button>
                </div>
                <textarea id="logrender" spellcheck="false" readonly>← Pick a log file from the left panel to start debugging</textarea>
            </div>
        </div>
        <br>
    </div>
</body>
<script>
    var currentOpenedLogURL = "";

    function openLogInNewTab() {
        if (currentOpenedLogURL != "") {
            window.open(currentOpenedLogURL);
        }
    }

    function openLog(object, category, filename) {
        $(".logfile.active").removeClass("active");
        $(object).addClass("active");
        currentOpenedLogURL = "../../system/log/read?file=" + filename + "&catergory=" + category;
        var displayName = $(object).find(".content").clone().children().remove().end().text().trim();
        $("#currentLogLabel").html(`<i class="file outline icon"></i> ${displayName}`);
        $.get(currentOpenedLogURL, function(data) {
            if (data.error !== undefined) {
                alert(data.error);
                return;
            }
            $("#logrender").val(data);
            $("#logrender").scrollTop($("#logrender")[0].scrollHeight);
        });
    }

    function initLogList() {
        $("#logList").html("");
        $.get("../../system/log/list", function(data) {
            for (let [key, value] of Object.entries(data)) {
                value.reverse();
                var fileItemList = "";
                value.forEach(file => {
                    fileItemList += `<div class="item clickable logfile" onclick="openLog(this, '${key}','${file.Filename}');">
                        <i class="file outline icon"></i>
                        <div class="content">
                            ${file.Title} (${formatBytes(file.Filesize)})
                            <div class="showing"><i class="green chevron right icon"></i></div>
                        </div>
                    </div>`;
                });
                $("#logList").append(`<div class="title">
                    <i class="dropdown icon"></i>${key}
                </div>
                <div class="content">
                    <div class="ui list">${fileItemList}</div>
                </div>`);
            }
            $(".ui.accordion").accordion();
        });
    }
    initLogList();

    function formatBytes(x) {
        var units = ['bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
        let l = 0, n = parseInt(x, 10) || 0;
        while (n >= 1024 && ++l) {
            n = n / 1024;
        }
        return (n.toFixed(n < 10 && l > 0 ? 1 : 0) + ' ' + units[l]);
    }
</script>
</html>
